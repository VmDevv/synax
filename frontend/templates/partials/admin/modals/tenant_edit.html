<dialog id="modal_edit_tenant" class="modal modal-bottom sm:modal-middle" open>
    <div class="modal-box bg-white border border-slate-200">
        <h3 class="font-bold text-lg text-slate-800 border-b border-slate-100 pb-2 mb-4">
            <i class="fa-solid fa-pen-to-square text-blue-600 mr-2"></i> Editar Empresa
        </h3>
        
        <form hx-post="/admin/tenants/{{ tenant.id }}/edit" hx-target="#admin-content" hx-swap="outerHTML">
            <div class="form-control w-full mb-4">
                <label class="label"><span class="label-text font-semibold text-slate-700">Razão Social</span></label>
                <input type="text" name="name" value="{{ tenant.name }}" required class="input input-bordered bg-slate-50 border-slate-300 w-full" />
            </div>
            
            <div class="form-control w-full mb-4">
                <label class="label"><span class="label-text font-semibold text-slate-700">CNPJ</span></label>
                <input type="text" name="cnpj" value="{{ tenant.cnpj }}" required class="input input-bordered bg-slate-50 border-slate-300 w-full" placeholder="00.000.000/0000-00" />
            </div>

            {# A UF decide CFOP 1933 (interna) x 2933 (interestadual) na auditoria de
               PDF. Ja esteve fixa como "ES" no codigo, e nota RJxRJ saia como 2933. #}
            <div class="form-control w-full mb-6">
                <label class="label"><span class="label-text font-semibold text-slate-700">UF</span></label>
                <input type="text" name="uf" value="{{ tenant.uf or '' }}" required maxlength="2"
                       style="text-transform: uppercase"
                       class="input input-bordered bg-slate-50 border-slate-300 w-full" placeholder="ES" />
                <span class="text-[11px] text-slate-500 mt-1">Estado da empresa. Decide se a nota de servico e CFOP 1933 (interna) ou 2933 (interestadual).</span>
            </div>
            
            <div class="modal-action">
                <button type="button" class="btn btn-ghost text-slate-500" onclick="document.getElementById('modal-container').innerHTML = ''">Cancelar</button>
                <button type="submit" class="btn bg-blue-600 hover:bg-blue-700 text-white border-none">Salvar Alterações</button>
            </div>
        </form>
    </div>
</dialog>
