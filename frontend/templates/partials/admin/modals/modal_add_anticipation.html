<dialog id="modal-add-anticipation" class="modal" onclick="if(event.target === this) this.close()">
    <div class="modal-box p-0 overflow-hidden bg-white max-w-3xl">
        <div class="bg-blue-600 px-6 py-4 flex justify-between items-center text-white">
            <h3 class="font-bold text-lg flex items-center gap-2">
                <i class="fa-solid fa-calculator"></i> Nova Regra: Antecipação ICMS
            </h3>
            <button class="btn btn-sm btn-circle btn-ghost text-white" onclick="this.closest('dialog').close()">✕</button>
        </div>
        <form hx-post="/admin/rules/anticipation/add" hx-swap="none" >
            <div class="p-6 space-y-4">
                <input type="hidden" name="tenant_id" value="{{ tenant_id }}">
                
                <div class="grid grid-cols-2 gap-4">
                    <div class="form-control w-full">
                        <label class="label"><span class="label-text font-bold text-slate-700">UF Origem</span></label>
                        <select name="uf_origem" class="select select-bordered w-full" required>
                            <option value="">Selecione...</option>
                            <option value="AC">AC</option><option value="AL">AL</option><option value="AP">AP</option>
                            <option value="AM">AM</option><option value="BA">BA</option><option value="CE">CE</option>
                            <option value="DF">DF</option><option value="ES">ES</option><option value="GO">GO</option>
                            <option value="MA">MA</option><option value="MT">MT</option><option value="MS">MS</option>
                            <option value="MG">MG</option><option value="PA">PA</option><option value="PB">PB</option>
                            <option value="PR">PR</option><option value="PE">PE</option><option value="PI">PI</option>
                            <option value="RJ">RJ</option><option value="RN">RN</option><option value="RS">RS</option>
                            <option value="RO">RO</option><option value="RR">RR</option><option value="SC">SC</option>
                            <option value="SP">SP</option><option value="SE">SE</option><option value="TO">TO</option>
                        </select>
                    </div>
                    
                    <div class="form-control w-full">
                        <label class="label"><span class="label-text font-bold text-slate-700">UF Destino</span></label>
                        <select name="uf_destino" class="select select-bordered w-full" required>
                            <option value="">Selecione...</option>
                            <option value="AC">AC</option><option value="AL">AL</option><option value="AP">AP</option>
                            <option value="AM">AM</option><option value="BA">BA</option><option value="CE">CE</option>
                            <option value="DF">DF</option><option value="ES">ES</option><option value="GO">GO</option>
                            <option value="MA">MA</option><option value="MT">MT</option><option value="MS">MS</option>
                            <option value="MG">MG</option><option value="PA">PA</option><option value="PB">PB</option>
                            <option value="PR">PR</option><option value="PE">PE</option><option value="PI">PI</option>
                            <option value="RJ">RJ</option><option value="RN">RN</option><option value="RS">RS</option>
                            <option value="RO">RO</option><option value="RR">RR</option><option value="SC">SC</option>
                            <option value="SP">SP</option><option value="SE">SE</option><option value="TO">TO</option>
                        </select>
                    </div>
                </div>

                <div class="form-control w-full">
                    <label class="label"><span class="label-text font-bold text-slate-700">CFOP</span></label>
                    <input type="text" name="cfop" placeholder="Ex: 5102" class="input input-bordered w-full" required />
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div class="form-control w-full">
                        <label class="label"><span class="label-text font-bold text-slate-700">MVA (%)</span></label>
                        <input type="number" step="0.01" name="mva" placeholder="0.00" class="input input-bordered w-full" required />
                    </div>
                    
                    <div class="form-control w-full">
                        <label class="label"><span class="label-text font-bold text-slate-700">Redução de Base (%)</span></label>
                        <input type="number" step="0.01" name="red_bc" placeholder="0.00" class="input input-bordered w-full" required />
                    </div>

                    <div class="form-control w-full">
                        <label class="label"><span class="label-text font-bold text-slate-700">Alíquota Interna (%)</span></label>
                        <input type="number" step="0.01" name="aliq_int" placeholder="0.00" class="input input-bordered w-full" required />
                    </div>
                    
                    <div class="form-control w-full">
                        <label class="label"><span class="label-text font-bold text-slate-700">Alíquota Interestadual (%)</span></label>
                        <input type="number" step="0.01" name="aliq_inter" placeholder="0.00" class="input input-bordered w-full" required />
                    </div>
                </div>
                
            </div>
            <div class="bg-slate-50 px-6 py-4 border-t border-slate-200 flex justify-end gap-2">
                <button type="button" class="btn btn-ghost" onclick="this.closest('dialog').close()">Cancelar</button>
                <button type="submit" class="btn bg-blue-600 hover:bg-blue-700 text-white border-none">Salvar Regra</button>
            </div>
        </form>
    </div>

</dialog>
