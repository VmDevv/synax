<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Synax | Auditor Fiscal Inteligente</title>
    
    <!-- Tailwind (Play CDN 3.4.17) servido daqui: cdn.tailwindcss.com não manda CORS,
         então SRI nele faria o navegador recusar o script. Origem em static/js/vendor/README.md -->
    <script src="/static/js/vendor/tailwind-3.4.17.js"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0" crossorigin="anonymous">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 font-sans antialiased selection:bg-blue-200">
    
    <div class="min-h-screen w-full flex items-center justify-center p-4">
        <main class="w-full max-w-md">
            
            <!-- Cabeçalho do Login -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-white border border-slate-200 mb-4 shadow-sm">
                    <img src="/static/img/logo.svg" alt="Synax Logo" class="h-10 w-10 object-contain">
                </div>
                <h1 class="text-3xl font-bold text-slate-800 mb-2 tracking-tight">Synax</h1>
                <p class="text-slate-500 font-medium">Auditor Fiscal Inteligente</p>
            </div>

            <!-- Card Branco -->
            <form action="/api/auth/login" method="POST" class="bg-white border border-slate-200 p-8 rounded-2xl shadow-lg">

                {# Leva de volta à tela que o usuário tentou abrir antes de a sessão expirar. #}
                <input type="hidden" name="next" value="{{ next or '/' }}">

                {% if error %}
                <div class="mb-6 bg-red-50 border border-red-200 text-red-600 text-sm p-4 rounded-xl flex items-start gap-3">
                    <i class="fa-solid fa-circle-exclamation mt-0.5"></i>
                    <p>{{ error }}</p>
                </div>
                {% endif %}

                {% if success %}
                <div class="mb-6 bg-emerald-50 border border-emerald-200 text-emerald-700 text-sm p-4 rounded-xl flex items-start gap-3">
                    <i class="fa-solid fa-circle-check mt-0.5"></i>
                    <p>{{ success }}</p>
                </div>
                {% endif %}

                <div class="space-y-5">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">E-mail Corporativo</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="fa-regular fa-envelope text-slate-400"></i>
                            </div>
                            <input type="email" name="email" required placeholder="admin@suaempresa.com.br"
                                class="w-full bg-slate-50 border border-slate-300 rounded-xl py-3 pl-11 pr-4 text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
                        </div>
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label class="block text-sm font-semibold text-slate-700">Senha</label>
                            <a href="/forgot-password" class="text-xs text-blue-600 hover:text-blue-700 transition-colors font-medium">Esqueceu?</a>
                        </div>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="fa-solid fa-lock text-slate-400"></i>
                            </div>
                            <input type="password" name="password" required placeholder="••••••••"
                                class="w-full bg-slate-50 border border-slate-300 rounded-xl py-3 pl-11 pr-4 text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
                        </div>
                    </div>

                    <button type="submit" class="w-full mt-6 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl transition-all shadow-md hover:shadow-lg flex justify-center items-center gap-2">
                        Entrar no Sistema
                        <i class="fa-solid fa-arrow-right-to-bracket"></i>
                    </button>
                </div>
            </form>

            <p class="text-center text-sm text-slate-400 mt-8">
                Motor de regras suportado pelo <span class="font-semibold text-slate-500">Supabase Auth</span>
            </p>

        </main>
    </div>
</body>
</html>
