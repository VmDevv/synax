<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Senha | Synax</title>
    <!-- Tailwind (Play CDN 3.4.17) servido daqui: cdn.tailwindcss.com não manda CORS,
         então SRI nele faria o navegador recusar o script. Origem em static/js/vendor/README.md -->
    <script src="/static/js/vendor/tailwind-3.4.17.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; } .hidden-el { display: none; }</style>
</head>
<body class="bg-slate-100 text-slate-900 font-sans antialiased">

    <div class="min-h-screen w-full flex items-center justify-center p-4">
        <main class="w-full max-w-md">

            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-white border border-slate-200 mb-4 shadow-sm">
                    <img src="/static/img/logo.svg" alt="Synax" class="h-10 w-10 object-contain">
                </div>
                <h1 class="text-3xl font-bold text-slate-800 mb-2 tracking-tight">Criar nova senha</h1>
                <p class="text-slate-500 font-medium">Escolha uma senha forte para sua conta</p>
            </div>

            <div class="bg-white border border-slate-200 p-8 rounded-2xl shadow-lg">

                {% if error %}
                <div class="mb-6 bg-red-50 border border-red-200 text-red-600 text-sm p-4 rounded-xl flex items-start gap-3">
                    <i class="fa-solid fa-circle-exclamation mt-0.5"></i>
                    <p>{{ error }}</p>
                </div>
                {% endif %}

                <!-- Exibido quando o link não traz token de recuperação -->
                <div id="no-token" class="hidden-el text-center">
                    <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-amber-50 text-amber-600 mb-4">
                        <i class="fa-solid fa-link-slash text-2xl"></i>
                    </div>
                    <h2 class="text-lg font-bold text-slate-800 mb-2">Link inválido ou expirado</h2>
                    <p class="text-sm text-slate-600 mb-5">
                        Abra esta página pelo link enviado ao seu e-mail. Se ele já expirou, solicite um novo.
                    </p>
                    <a href="/forgot-password"
                       class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-5 rounded-xl transition-all shadow-md">
                        Solicitar novo link
                    </a>
                </div>

                <form id="reset-form" action="/api/auth/reset-password" method="POST" class="space-y-5 hidden-el">
                    <!-- Preenchido pelo JS a partir do fragmento da URL -->
                    <input type="hidden" name="access_token" id="access_token">

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Nova senha</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="fa-solid fa-lock text-slate-400"></i>
                            </div>
                            <input type="password" name="password" id="password" required minlength="8" placeholder="Mínimo de 8 caracteres"
                                class="w-full bg-slate-50 border border-slate-300 rounded-xl py-3 pl-11 pr-4 text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Confirmar nova senha</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="fa-solid fa-lock text-slate-400"></i>
                            </div>
                            <input type="password" name="password_confirm" id="password_confirm" required minlength="8" placeholder="Repita a senha"
                                class="w-full bg-slate-50 border border-slate-300 rounded-xl py-3 pl-11 pr-4 text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
                        </div>
                        <p id="mismatch" class="hidden-el mt-2 text-xs text-red-600 font-medium">
                            <i class="fa-solid fa-triangle-exclamation mr-1"></i>As senhas não conferem.
                        </p>
                    </div>

                    <button type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl transition-all shadow-md hover:shadow-lg flex justify-center items-center gap-2">
                        Salvar nova senha
                        <i class="fa-solid fa-check"></i>
                    </button>
                </form>

                <div class="mt-6 pt-5 border-t border-slate-200 text-center">
                    <a href="/login" class="text-sm text-slate-500 hover:text-slate-700 font-medium transition-colors">
                        <i class="fa-solid fa-arrow-left mr-1 text-xs"></i> Voltar ao login
                    </a>
                </div>
            </div>

        </main>
    </div>

<script>
(() => {
    // O Supabase devolve o token de recovery no FRAGMENTO da URL (#access_token=...).
    // O fragmento nunca é enviado ao servidor, então lemos aqui e o repassamos no POST.
    const params = new URLSearchParams(window.location.hash.slice(1));
    const token = params.get('access_token');
    const type = params.get('type');

    const form = document.getElementById('reset-form');
    const noToken = document.getElementById('no-token');

    if (token && (type === 'recovery' || !type)) {
        document.getElementById('access_token').value = token;
        form.classList.remove('hidden-el');
        // Remove o token da barra de endereços para não vazar em histórico/print.
        history.replaceState(null, '', window.location.pathname);
        document.getElementById('password').focus();
    } else if (!document.querySelector('.bg-red-50')) {
        noToken.classList.remove('hidden-el');
    }

    form.addEventListener('submit', (e) => {
        const pwd = document.getElementById('password').value;
        const confirm = document.getElementById('password_confirm').value;
        const mismatch = document.getElementById('mismatch');
        if (pwd !== confirm) {
            e.preventDefault();
            mismatch.classList.remove('hidden-el');
        } else {
            mismatch.classList.add('hidden-el');
        }
    });
})();
</script>
</body>
</html>
